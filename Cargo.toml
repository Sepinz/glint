[package]
name = "glint"
version = "0.1.0"
edition = "2021"
description = "Instant file-name search for Windows: raw NTFS MFT indexing and live USN journal updates"
license = "MIT"
repository = "https://github.com/Sepinz/glint"
readme = "README.md"
keywords = ["search", "windows", "ntfs", "mft", "files"]
categories = ["command-line-utilities", "filesystem"]
build = "build.rs"

[lib]
name = "glint"
path = "src/lib.rs"

[[bin]]
name = "glint"
path = "src/bin/glint/main.rs"

[[bin]]
name = "glint-cli"
path = "src/bin/glint-cli/main.rs"

[dependencies]
rayon = "1.10"
memchr = "2.7"
regex = { version = "1.11", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
regex-syntax = { version = "0.8", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
bytemuck = "1.16"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
