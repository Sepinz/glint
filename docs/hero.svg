<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Glint: typing notepad narrows 5.1 million items to 265 matches, each keystroke answered in under 11 milliseconds.">
<style>
.sans{font-family:"Segoe UI Variable Display","Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
.mono{font-family:"Cascadia Code",ui-monospace,SFMono-Regular,Consolas,monospace}
.f{opacity:0;animation:show 8.0s step-end infinite}
.last{animation:last 8.0s step-end infinite}
.caret{animation:blink 1.1s steps(2,jump-none) infinite}
@keyframes show{0%{opacity:1}5.625%,100%{opacity:0}}
@keyframes last{0%{opacity:0}33.750%,100%{opacity:1}}
@keyframes blink{from{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion:reduce){.f,.last,.caret{animation:none}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171b24"/><stop offset="1" stop-color="#0b0d12"/></linearGradient>
<radialGradient id="flare"><stop offset="0" stop-color="#ffb938" stop-opacity=".34"/><stop offset="1" stop-color="#ffb938" stop-opacity="0"/></radialGradient>
<clipPath id="p"><rect width="1200" height="600" rx="20"/></clipPath>
</defs>
<g clip-path="url(#p)"><rect width="1200" height="600" fill="url(#bg)"/><circle cx="86" cy="82" r="150" fill="url(#flare)"/></g>
<path d="M86 40C89 68 100 79 128 82 100 85 89 96 86 124 83 96 72 85 44 82 72 79 83 68 86 40Z" fill="#ffb938"/>
<text x="146" y="108" class="sans" font-size="78" font-weight="700" letter-spacing="-2" fill="#f5f6f8">glint</text>
<text x="1144" y="92" text-anchor="end" class="sans" font-size="27" fill="#9aa3b2">5,115,925 items. Every keystroke.</text>
<rect x="56" y="156" width="1088" height="84" rx="14" fill="#05070a" stroke="#ffb938" stroke-opacity=".75" stroke-width="2"/>
<g class="f" style="animation-delay:0.00s"><text x="88" y="211" class="mono" font-size="36" fill="#f5f6f8">n</text><rect x="112" y="181" width="3" height="36" fill="#ffb938"/>
<text x="1112" y="209" text-anchor="end" class="mono" font-size="28" fill="#9aa3b2">2,497,862 matches in <tspan fill="#ffb938" font-weight="700">10.55 ms</tspan></text></g>
<g class="f" style="animation-delay:0.45s"><text x="88 110" y="211" class="mono" font-size="36" fill="#f5f6f8">no</text><rect x="134" y="181" width="3" height="36" fill="#ffb938"/>
<text x="1112" y="209" text-anchor="end" class="mono" font-size="28" fill="#9aa3b2">252,116 matches in <tspan fill="#ffb938" font-weight="700">6.68 ms</tspan></text></g>
<g class="f" style="animation-delay:0.90s"><text x="88 110 132" y="211" class="mono" font-size="36" fill="#f5f6f8">not</text><rect x="156" y="181" width="3" height="36" fill="#ffb938"/>
<text x="1112" y="209" text-anchor="end" class="mono" font-size="28" fill="#9aa3b2">57,786 matches in <tspan fill="#ffb938" font-weight="700">6.38 ms</tspan></text></g>
<g class="f" style="animation-delay:1.35s"><text x="88 110 132 154" y="211" class="mono" font-size="36" fill="#f5f6f8">note</text><rect x="178" y="181" width="3" height="36" fill="#ffb938"/>
<text x="1112" y="209" text-anchor="end" class="mono" font-size="28" fill="#9aa3b2">1,408 matches in <tspan fill="#ffb938" font-weight="700">6.96 ms</tspan></text></g>
<g class="f" style="animation-delay:1.80s"><text x="88 110 132 154 176" y="211" class="mono" font-size="36" fill="#f5f6f8">notep</text><rect x="200" y="181" width="3" height="36" fill="#ffb938"/>
<text x="1112" y="209" text-anchor="end" class="mono" font-size="28" fill="#9aa3b2">270 matches in <tspan fill="#ffb938" font-weight="700">7.15 ms</tspan></text></g>
<g class="f" style="animation-delay:2.25s"><text x="88 110 132 154 176 198" y="211" class="mono" font-size="36" fill="#f5f6f8">notepa</text><rect x="222" y="181" width="3" height="36" fill="#ffb938"/>
<text x="1112" y="209" text-anchor="end" class="mono" font-size="28" fill="#9aa3b2">265 matches in <tspan fill="#ffb938" font-weight="700">6.31 ms</tspan></text></g>
<g class="last"><text x="88 110 132 154 176 198 220" y="211" class="mono" font-size="36" fill="#f5f6f8">notepad</text><rect class="caret" x="244" y="181" width="3" height="36" fill="#ffb938"/>
<text x="1112" y="209" text-anchor="end" class="mono" font-size="28" fill="#9aa3b2">265 matches in <tspan fill="#ffb938" font-weight="700">7.59 ms</tspan></text></g>
<g class="last"><text x="88" y="298" class="mono" font-size="24" fill="#f5f6f8">Notepad.exe</text><text x="370" y="298" class="mono" font-size="22" fill="#9aa3b2">C:\Program Files\WindowsApps\...\Notepad</text><text x="88" y="342" class="mono" font-size="24" fill="#f5f6f8">notepad.exe</text><text x="370" y="342" class="mono" font-size="22" fill="#9aa3b2">C:\Windows\System32</text><text x="88" y="386" class="mono" font-size="24" fill="#f5f6f8">notepad.exe.mui</text><text x="370" y="386" class="mono" font-size="22" fill="#9aa3b2">C:\Windows\System32\en-US</text></g>
<line x1="56" x2="1144" y1="424" y2="424" stroke="#ffffff" stroke-opacity=".1"/>
<text x="56" y="500" class="sans" font-size="52" font-weight="700" fill="#f5f6f8">5–7 ms</text><text x="56" y="540" class="sans" font-size="25" fill="#9aa3b2">to search everything</text>
<text x="346" y="500" class="sans" font-size="52" font-weight="700" fill="#f5f6f8">~80 ms</text><text x="346" y="540" class="sans" font-size="25" fill="#9aa3b2">to start, index ready</text>
<text x="646" y="500" class="sans" font-size="52" font-weight="700" fill="#f5f6f8">0.2 MB</text><text x="646" y="540" class="sans" font-size="25" fill="#9aa3b2">of RAM while idle</text>
<text x="916" y="500" class="sans" font-size="52" font-weight="700" fill="#f5f6f8">1.7 MB</text><text x="916" y="540" class="sans" font-size="25" fill="#9aa3b2">no runtime to install</text>
</svg>
