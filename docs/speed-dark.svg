<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Bar chart of search times over 5.1 million items. All six search types finish in 4.4 to 14.3 milliseconds, under one 16.7 millisecond screen refresh.">
<g font-family='"Segoe UI Variable Display","Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,sans-serif'>
<rect x="1" y="1" width="1198" height="558" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="56" y="72" font-size="36" font-weight="700" fill="#e6edf3">Every search finishes inside one screen refresh</text>
<text x="56" y="112" font-size="25" fill="#8b949e">Milliseconds to search 5.1 million items</text>
<line x1="340" x2="340" y1="164" y2="520" stroke="#30363d" stroke-width="2"/>
<line x1="1108" x2="1108" y1="164" y2="520" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 7"/>
<text x="1144" y="152" text-anchor="end" font-size="23" fill="#8b949e">One frame at 60 Hz: 16.7 ms</text>
<text x="316" y="199.0" text-anchor="end" font-size="25" fill="#e6edf3">Size filter</text><path d="M340 178h198q4 0 4 4v16q0 4-4 4h-198z" fill="#c98008"/><text x="556" y="199.0" font-size="25" font-weight="600" fill="#e6edf3">4.4 ms</text><text x="316" y="257.0" text-anchor="end" font-size="25" fill="#e6edf3">Wildcard</text><path d="M340 236h235q4 0 4 4v16q0 4-4 4h-235z" fill="#c98008"/><text x="593" y="257.0" font-size="25" font-weight="600" fill="#e6edf3">5.2 ms</text><text x="316" y="315.0" text-anchor="end" font-size="25" fill="#e6edf3">Plain name</text><path d="M340 294h244q4 0 4 4v16q0 4-4 4h-244z" fill="#c98008"/><text x="602" y="315.0" font-size="25" font-weight="600" fill="#e6edf3">5.4 ms</text><text x="316" y="373.0" text-anchor="end" font-size="25" fill="#e6edf3">Full path</text><path d="M340 352h295q4 0 4 4v16q0 4-4 4h-295z" fill="#c98008"/><text x="653" y="373.0" font-size="25" font-weight="600" fill="#e6edf3">6.5 ms</text><text x="316" y="431.0" text-anchor="end" font-size="25" fill="#e6edf3">Extensions</text><path d="M340 410h318q4 0 4 4v16q0 4-4 4h-318z" fill="#c98008"/><text x="676" y="431.0" font-size="25" font-weight="600" fill="#e6edf3">7.0 ms</text><text x="316" y="489.0" text-anchor="end" font-size="25" fill="#e6edf3">Regular expression</text><path d="M340 468h654q4 0 4 4v16q0 4-4 4h-654z" fill="#c98008"/><text x="1012" y="489.0" font-size="25" font-weight="600" fill="#e6edf3">14.3 ms</text>
</g>
